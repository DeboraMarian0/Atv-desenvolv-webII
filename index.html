<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap css -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    
    <title>Manipulando o DOM</title>
   
    <!-- folha de estilo -->
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>

    </header>

    <main>
        <section class="formulario-cadastro">
            <div class="container container-form">
                <h1>Meus Contatos</h1>

                <div class="tema espacamento">
                    <label>Tema:</label>

                    <input type="radio" name="tema" id="claro" onclick="mudarTema()" value="claro">
                    <label for="claro" class="check">Claro</label>
                
                    <input type="radio" name="tema" id="escuro" onclick="mudarTema()" value="escuro">
                    <label for="escuro" class="check">Escuro</label>
                     
                </div>

                <div class="espacamento">
                    <label for="nome">Nome:</label> 
                    <input type="text" class="form-control" id="nome"> 
                </div>

                <div class="espacamento">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" pattern="\d{2} \d{5}-\d{4}$" class="form-control" id = "telefone" placeholder="(DDD) 9xxxx-xxxx">
                </div>
                    
                <div class="espacamento">
                    <label for="contato">Tipo de Contato:</label>
                    <select name="tipo-contato" id="contato" class="form-control">
                        <option>Parente</option>
                        <option>Amigo</option>
                        <option>Colega de Trabalho</option>
                        <option>Outro</option>
                    </select>
                </div>

                <span class="erro"></span>
                <br>
                <button onclick="adicionar()" class="btn btn-success button">Adicionar</button>
                <br>

                <ul id="lista">

                </ul>

                <button onclick="limpar()" class="btn btn-danger">Limpar Lista</button>
               
            </div>
        </section>
        

    </main>
    
    <footer>

    </footer>

    

    <script src="app.js" defer></script> <!-- o atributo defer garante que o arquivo JavaScript externo será carregado após a conclusão do carregamento do HTML -->
</body>
</html>
